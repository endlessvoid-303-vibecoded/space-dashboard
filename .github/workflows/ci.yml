name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          echo "package.json: valid"

      - name: Validate CI workflow YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('ci.yml: valid')"

      - name: Validate deploy workflow YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/deploy.yml')); print('deploy.yml: valid')"

      - name: Validate PLAN.md exists
        run: |
          test -f PLAN.md
          echo "PLAN.md: present"

  lint-test:
    name: Lint + Test + Typecheck
    needs: validate
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  e2e:
    name: E2E (Playwright)
    needs: lint-test
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
