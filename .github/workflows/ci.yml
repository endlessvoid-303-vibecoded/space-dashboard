name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Validate CI workflow YAML
        run: npx -y js-yaml .github/workflows/ci.yml > /dev/null

      - name: Validate deploy workflow YAML
        run: npx -y js-yaml .github/workflows/deploy.yml > /dev/null

  lint-test:
    name: Lint + Test + Typecheck
    needs: validate
    if: hashFiles('svelte.config.js') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx svelte-check --tsconfig tsconfig.json

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    needs: lint-test
    if: hashFiles('svelte.config.js') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
